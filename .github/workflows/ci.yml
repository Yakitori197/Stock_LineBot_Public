name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run offline storage tests
        run: python -m pytest tests -q

  docker:
    name: Docker build and offline smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build the production image without starting the bot or scheduler loop.
      - name: Build production image
        run: docker build --pull --tag stock-linebot:ci .
      - name: Check installed image dependencies
        run: docker run --rm --network none --entrypoint python stock-linebot:ci -m pip check
      - name: Import web and scheduler modules with synthetic settings
        run: |
          docker run --rm --network none --tmpfs /tmp \
            -e LINE_CHANNEL_ACCESS_TOKEN=ci-placeholder \
            -e LINE_CHANNEL_SECRET=ci-placeholder \
            -e DB_PATH=/tmp/linebot-ci.db \
            --entrypoint python stock-linebot:ci \
            -c "from importlib.metadata import version; import yfinance; from src.app import app; import src.scheduler; assert version('yolab-quote') == '0.1.1'; assert app.test_client().get('/health').status_code == 200"
